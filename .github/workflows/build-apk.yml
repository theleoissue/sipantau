name: Bangun APK Android

# Dipicu manual dari tab Actions (tombol "Run workflow") — bukan pada
# setiap dorongan kode, supaya tidak menghabiskan menit CI gratis untuk
# perubahan yang belum siap diuji sebagai APK.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang dependensi npm
        run: npm ci

      - name: Sinkronkan proyek Android Capacitor
        # android/capacitor-cordova-android-plugins SENGAJA tidak ikut
        # Git (android/.gitignore) — dianggap berkas hasil-generate,
        # sama seperti node_modules. Tanpa langkah ini, build gagal
        # "cordova.variables.gradle ... does not exist" karena folder
        # itu memang belum pernah dibangkitkan pada checkout yang segar.
        run: npx cap sync android

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Izinkan gradlew dieksekusi
        # Berkas ini dikomit dari Windows, yang tidak mengenal bit
        # eksekusi Unix — tanpa ini ./gradlew gagal exit 126 (permission
        # denied) di runner Linux, terlepas dari isi berkasnya sendiri.
        run: chmod +x android/gradlew

      - name: Bangun APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: sipantau-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
